name: mixlists_importer
description: >
  CLI that authenticates with your own Spotify account and pulls your
  playlists into a local mixlists.db matching the Mixlists app's schema.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  args: ^2.6.0
  http: ^1.2.0
  crypto: ^3.0.3
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.2
  mixlists_core:
    path: ../mixlists_core

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

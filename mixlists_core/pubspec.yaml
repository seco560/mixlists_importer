name: mixlists_core
description: >
  Shared schema, entities, CSV parsing, and ingestion/dedup logic for the
  Mixlists project -- used by both the Flutter app and the Mixlists
  Importer CLI. Pure Dart, no Flutter dependency.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  sqflite_common_ffi: ^2.4.2
  path: ^1.9.1
  csv: ^8.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
